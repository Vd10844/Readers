services:
  api:
    build: .
    ports:
      - "8000:8000"
    shm_size: '2gb' # Crucial for high-res vision patching
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
      - huggingface_cache:/root/.cache/huggingface

volumes:
  huggingface_cache: